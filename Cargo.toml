[package]
name = "yew-tower-defense-game"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gloo-timers = "0.3"
gloo-utils = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "CustomEvent",
  "CustomEventInit",
  "Event",
] }
yew = { version = "0.23", features = ["csr"] }
yewdux = "0.13"
